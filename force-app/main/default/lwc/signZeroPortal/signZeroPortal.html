<template>
    <div class="portal-root" style={dynamicBrandStyles}>
        <!-- Document bar; logo and company name are in signZeroHeader. -->
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-shrink-none slds-theme_default slds-border_bottom slds-p-horizontal_medium slds-p-vertical_x-small">
            <div class="slds-truncate">
                <h1 class="slds-text-heading_small slds-truncate" title={documentName}>{documentName}</h1>
                <p class="slds-text-body_small slds-text-color_weak">{envelopeNumber}</p>
            </div>
            <template lwc:if={isSigning}>
                <div class="slds-no-flex">
                    <template lwc:if={adoptedSignature}>
                        <lightning-button variant="brand-outline" class="slds-m-left_small" label={labels.changeSignature}
                            onclick={handleChangeSignature}></lightning-button>
                    </template>
                    <template lwc:if={allowReassign}>
                        <lightning-button variant="brand-outline" class="slds-m-left_small" label={labels.reassignAction}
                            onclick={openReassignModal}></lightning-button>
                    </template>
                    <lightning-button variant="destructive" class="slds-m-left_small" label={labels.decline}
                        onclick={openDeclineModal}></lightning-button>
                </div>
            </template>
        </div>

        <template lwc:if={isLoading}>
            <div class="status-panel slds-text-align_center slds-p-around_large">
                <div class="spinner-holder slds-is-relative">
                    <lightning-spinner variant="brand" size="medium" alternative-text={loadingMessage}></lightning-spinner>
                </div>
                <p class="slds-m-top_medium">{loadingMessage}</p>
            </div>
        </template>

        <template lwc:if={isError}>
            <div class="status-panel slds-text-align_center slds-p-around_large">
                <lightning-icon icon-name="utility:error" variant="error" size="large" alternative-text={errorTitle}></lightning-icon>
                <h2 class="slds-text-heading_medium slds-m-vertical_small">{errorTitle}</h2>
                <p>{errorMessage}</p>
            </div>
        </template>

        <template lwc:if={isDone}>
            <div class="status-panel slds-text-align_center slds-p-around_large">
                <lightning-icon icon-name="utility:success" variant="success" size="large" alternative-text={doneTitle}></lightning-icon>
                <h2 class="slds-text-heading_medium slds-m-vertical_small">{doneTitle}</h2>
                <p>{doneMessage}</p>
            </div>
        </template>

        <template lwc:if={isReassigned}>
            <div class="status-panel slds-text-align_center slds-p-around_large">
                <lightning-icon icon-name="utility:success" variant="success" size="large" alternative-text={reassignedTitle}></lightning-icon>
                <h2 class="slds-text-heading_medium slds-m-vertical_small">{reassignedTitle}</h2>
                <p>{reassignedMessage}</p>
            </div>
        </template>

        <template lwc:if={isDeclined}>
            <div class="status-panel slds-text-align_center slds-p-around_large">
                <lightning-icon icon-name="utility:close" size="large" alternative-text={labels.declinedTitle}></lightning-icon>
                <h2 class="slds-text-heading_medium slds-m-vertical_small">{labels.declinedTitle}</h2>
                <p>{labels.declinedMessage}</p>
            </div>
        </template>

        <template lwc:if={isViewing}>
            <div class="slds-notify slds-notify_alert" role="status">
                <h2>{viewingMessage}</h2>
            </div>
        </template>

        <template lwc:if={showViewer}>
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap slds-theme_default slds-border_bottom slds-p-horizontal_medium slds-p-vertical_xx-small"
                role="toolbar">
                <div class="slds-grid slds-grid_vertical-align-center">
                    <lightning-button-icon icon-name="utility:chevronleft" variant="border-filled" size="small"
                        title={labels.prevPage} alternative-text={labels.prevPage} onclick={handlePrevPage}
                        disabled={isFirstPage}></lightning-button-icon>
                    <span class="toolbar-value slds-text-body_small slds-text-align_center" aria-live="polite">{pageIndicator}</span>
                    <lightning-button-icon icon-name="utility:chevronright" variant="border-filled" size="small"
                        title={labels.nextPage} alternative-text={labels.nextPage} onclick={handleNextPage}
                        disabled={isLastPage}></lightning-button-icon>
                </div>
                <div class="slds-grid slds-grid_vertical-align-center">
                    <lightning-button-icon icon-name="utility:dash" variant="border-filled" size="small"
                        title={labels.zoomOut} alternative-text={labels.zoomOut} onclick={handleZoomOut}></lightning-button-icon>
                    <span class="toolbar-value slds-text-body_small slds-text-align_center">{zoomLabel}</span>
                    <lightning-button-icon icon-name="utility:add" variant="border-filled" size="small"
                        title={labels.zoomIn} alternative-text={labels.zoomIn} onclick={handleZoomIn}></lightning-button-icon>
                    <lightning-button-group class="slds-m-left_small">
                        <lightning-button variant={fitPageVariant} label={labels.fitPage}
                            onclick={handleFitPage}></lightning-button>
                        <lightning-button variant={fitWidthVariant} label={labels.fitWidth}
                            onclick={handleFitWidth}></lightning-button>
                    </lightning-button-group>
                </div>
            </div>
        </template>

        <main class={documentContainerClass}>
            <div class="pdf-scroll-viewport">
                <div class="pages-wrapper" lwc:dom="manual"></div>
            </div>
            <template lwc:if={placingHint}>
                <div class="placing-hint slds-notify slds-notify_toast slds-theme_info" role="status">
                    <h2 class="slds-text-heading_small">{placingHint}</h2>
                </div>
            </template>
            <template lwc:if={openingDocument}>
                <div class="opening-document slds-text-align_center" role="status">
                    <div class="spinner-holder slds-is-relative">
                        <lightning-spinner variant="brand" size="medium" alternative-text={labels.loadingDocument}></lightning-spinner>
                    </div>
                    <p class="slds-m-top_medium">{labels.loadingDocument}</p>
                </div>
            </template>
        </main>

        <template lwc:if={showGuide}>
            <div class="guided-nav-container">
                <template lwc:if={showAddAnother}>
                    <lightning-button variant="neutral" class="guided-nav-button slds-m-right_small" label={labels.placeAnother}
                        onclick={handleAddAnotherSignature}></lightning-button>
                </template>
                <lightning-button variant="brand" class="guided-nav-button" label={guideButtonLabel}
                    onclick={handleJumpToNextField} disabled={isSubmitting}></lightning-button>
            </div>
        </template>

        <template lwc:if={showConsentModal}>
            <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true" aria-labelledby="consent-title">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <h2 id="consent-title" class="slds-modal__title slds-hyphenate">{labels.consentTitle}</h2>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium slds-text-longform">
                        <p>{consentGreeting}</p>
                        <p>{labels.consentBody}</p>
                        <p>{labels.consentPaperOption}</p>
                    </div>
                    <div class="slds-modal__footer slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div>
                            <!-- The wrong recipient can pass it on without agreeing to anything. -->
                            <template lwc:if={allowReassign}>
                                <lightning-button variant="base" label={labels.reassignAction}
                                    onclick={openReassignModal}></lightning-button>
                            </template>
                        </div>
                        <div>
                            <template lwc:if={canPostponeConsent}>
                                <lightning-button label={labels.consentNotNow} onclick={closeConsentModal}></lightning-button>
                            </template>
                            <lightning-button class="slds-m-left_x-small" label={labels.decline}
                                onclick={openDeclineModal}></lightning-button>
                            <lightning-button class="slds-m-left_x-small" variant="brand" label={labels.consentAccept}
                                onclick={handleAcceptConsent} disabled={isWorking}></lightning-button>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <template lwc:if={showSignatureModal}>
            <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true" aria-labelledby="sig-title">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <h2 id="sig-title" class="slds-modal__title slds-hyphenate">{labels.padTitle}</h2>
                        <p class="slds-m-top_x-small slds-text-color_weak">{labels.padHelp}</p>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-tabset active-tab-value={signatureMode}>
                            <lightning-tab label={labels.tabType} value="type" onactive={handleModeChange}></lightning-tab>
                            <lightning-tab label={labels.tabDraw} value="draw" onactive={handleModeChange}></lightning-tab>
                            <lightning-tab label={labels.tabUpload} value="upload" onactive={handleModeChange}></lightning-tab>
                        </lightning-tabset>

                        <template lwc:if={isTypeMode}>
                            <div class="slds-form-element slds-m-top_medium">
                                <label class="slds-form-element__label" for="typed-name">{labels.typeLabel}</label>
                                <div class="slds-form-element__control">
                                    <input id="typed-name" class="slds-input" type="text" maxlength="80"
                                        value={typedName} oninput={handleTypedNameChange} />
                                </div>
                            </div>
                            <fieldset class="slds-form-element slds-m-top_small">
                                <legend class="slds-form-element__label">{labels.typeStyle}</legend>
                                <div class="slds-form-element__control typed-options" role="radiogroup">
                                    <template for:each={typedStyleOptions} for:item="option">
                                        <button key={option.index} class={option.className} role="radio"
                                            aria-checked={option.selected} data-index={option.index}
                                            onclick={handleTypedStyleChange}>
                                            <span class="typed-preview" style={option.inlineStyle}>{option.text}</span>
                                        </button>
                                    </template>
                                </div>
                            </fieldset>
                        </template>

                        <template lwc:if={isDrawMode}>
                            <p class="slds-m-top_medium slds-text-color_weak">{labels.drawHelp}</p>
                            <div class="slds-box slds-p-around_none slds-m-top_x-small slds-theme_shade">
                                <canvas class="sig-pad" onpointerdown={startDrawing} onpointermove={draw}
                                    onpointerup={stopDrawing} onpointerleave={stopDrawing}
                                    onpointercancel={stopDrawing}></canvas>
                            </div>
                        </template>

                        <template lwc:if={isUploadMode}>
                            <lightning-input type="file" label={labels.uploadLabel} accept="image/png,image/jpeg"
                                onchange={handleUpload}></lightning-input>
                            <div class="slds-form-element__help">{labels.uploadHelp}</div>
                            <template lwc:if={uploadError}>
                                <p class="slds-text-color_error slds-m-top_x-small" role="alert">{uploadError}</p>
                            </template>
                            <template lwc:if={isProcessingUpload}>
                                <div class="slds-box slds-theme_shade slds-m-top_small slds-grid slds-grid_align-center slds-grid_vertical-align-center upload-box"
                                    role="status">
                                    <div class="spinner-holder-small slds-is-relative">
                                        <lightning-spinner variant="brand" size="small"
                                            alternative-text={labels.uploadProcessing}></lightning-spinner>
                                    </div>
                                    <span class="slds-m-left_small slds-text-color_weak">{labels.uploadProcessing}</span>
                                </div>
                            </template>
                            <template lwc:if={uploadedSignature}>
                                <div class="slds-box slds-theme_shade slds-m-top_small slds-align_absolute-center upload-box upload-preview">
                                    <img src={uploadedSignature} alt={labels.uploadLabel} />
                                </div>
                            </template>
                        </template>
                    </div>
                    <div class="slds-modal__footer slds-grid slds-grid_align-spread">
                        <lightning-button variant="destructive" label={labels.clear} onclick={clearSignaturePad}></lightning-button>
                        <div>
                            <lightning-button label={labels.cancel} onclick={closeSignatureModal}></lightning-button>
                            <lightning-button class="slds-m-left_x-small" variant="brand" label={labels.adoptSign}
                                onclick={confirmSignaturePlacement} disabled={adoptDisabled}></lightning-button>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <template lwc:if={showDeclineModal}>
            <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true" aria-labelledby="decline-title">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <h2 id="decline-title" class="slds-modal__title slds-hyphenate">{labels.declineTitle}</h2>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label" for="decline-reason">{labels.declineReason}</label>
                            <div class="slds-form-element__control">
                                <textarea id="decline-reason" class="slds-textarea" rows="4"
                                    onchange={handleReasonChange}></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label={labels.back} onclick={closeDeclineModal}></lightning-button>
                        <lightning-button class="slds-m-left_x-small" variant="destructive" label={labels.decline}
                            onclick={confirmDecline} disabled={isWorking}></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <template lwc:if={showReassignModal}>
            <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true" aria-labelledby="reassign-title">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <h2 id="reassign-title" class="slds-modal__title slds-hyphenate">{labels.reassignAction}</h2>
                        <p class="slds-m-top_x-small slds-text-color_weak">{labels.reassignHelp}</p>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label" for="reassign-name">{labels.reassignName}</label>
                            <div class="slds-form-element__control">
                                <input id="reassign-name" class="slds-input" type="text" maxlength="80" data-field="name"
                                    value={reassignTo.name} oninput={handleReassignInput} />
                            </div>
                        </div>
                        <div class="slds-form-element slds-m-top_small">
                            <label class="slds-form-element__label" for="reassign-email">{labels.reassignEmail}</label>
                            <div class="slds-form-element__control">
                                <input id="reassign-email" class="slds-input" type="email" maxlength="80" data-field="email"
                                    value={reassignTo.email} oninput={handleReassignInput} />
                            </div>
                        </div>
                        <div class="slds-form-element slds-m-top_small">
                            <label class="slds-form-element__label" for="reassign-reason">{labels.reassignReason}</label>
                            <div class="slds-form-element__control">
                                <textarea id="reassign-reason" class="slds-textarea" rows="3" data-field="reason"
                                    oninput={handleReassignInput}></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label={labels.back} onclick={closeReassignModal}></lightning-button>
                        <lightning-button class="slds-m-left_x-small" variant="brand" label={labels.reassignConfirm}
                            onclick={confirmReassign} disabled={isWorking}></lightning-button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <template lwc:if={pdfEngineUrl}>
            <iframe class="pdf-engine" src={pdfEngineUrl} title="SignZero PDF engine" tabindex="-1" aria-hidden="true"></iframe>
        </template>

        <template lwc:if={toastMessage}>
            <div class="slds-notify_container">
                <div class={toastClass} role="alert">
                    <lightning-icon class="slds-m-right_small" icon-name={toastIcon} variant="inverse" size="small"></lightning-icon>
                    <div class="slds-notify__content">
                        <h2 class="slds-text-heading_small">{toastMessage}</h2>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
