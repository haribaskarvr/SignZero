<!doctype html>
<!--
    SignZero PDF host. The signing portal loads this page in a hidden iframe on the same site, so the PDF work runs
    outside Lightning Web Security: PDF.js gets its Web Worker and canvas runs at full speed. It has no access to
    Salesforce data; it only transforms the PDF bytes the portal posts to it and answers same-origin messages only.
-->
<html data-signzero-host>
    <head>
        <meta charset="utf-8" />
        <title>SignZero PDF engine</title>
        <!--
            engine.js starts PDF.js's worker as soon as it runs; it needs pdf-lib only when called, so pdf-lib comes last.
            The site lets browsers keep each file for weeks, and a browser can hold this page and the scripts from
            different deploys. So the scripts are loaded at an address carrying this page's deploy time, which always
            gives the versions deployed with it.
        -->
        <script>
            (function () {
                var version = Date.parse(document.lastModified) || 0;
                ['pdf.min.js', 'engine.js', 'pdf-lib.min.js'].forEach(function (file) {
                    document.write('<script src="' + file + '?v=' + version + '"><\/script>');
                });
            })();
        </script>
    </head>
    <body></body>
</html>
